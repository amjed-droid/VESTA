[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vesta-transit"
version = "3.0.0"
authors = [
  { name="Ahmed Sattar Jabbar", email="ahmed.state.me@gmail.com" },
]
description = "Official Python implementation of VESTA: A Depth-Invariant, Variance-Stabilized Transit Vetting Framework for Space-Based Photometry (Kepler/TESS/PLATO). Submitted to Astronomy and Computing."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "astropy>=4.3",
    "scikit-learn>=1.0",
    "lightkurve>=2.0"
]

[project.urls]
"Homepage" = "https://github.com/amjed-droid/VESTA"
"Bug Tracker" = "https://github.com/amjed-droid/VESTA/issues"
